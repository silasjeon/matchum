<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{color-scheme:light dark;
    --bg:#f6f7f9;--card:#fff;--ink:#1b2230;--mute:#6b7684;--line:#e1e5ea;--on:#0f8f7a;--off:#c3cad2;--err:#c0392b}
  @media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1c2229;--ink:#e8edf2;--mute:#8c99a6;--line:#2b333c;--on:#3fc3a9;--off:#3a444f;--err:#ff7b6b}}
  body{margin:0;width:320px;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,"SF Pro Text","Apple SD Gothic Neo",system-ui,sans-serif}
  header{display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px}
  header b{font-size:15px;letter-spacing:-.01em}
  header span{color:var(--mute);font-size:11.5px;margin-left:auto;font-family:"SF Mono",ui-monospace,monospace}
  header span.error{color:var(--err)}
  ul{list-style:none;margin:0 12px 12px;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  .txt{flex:1;min-width:0}
  .name{font-weight:600;font-family:"SF Mono",ui-monospace,monospace;font-size:12.5px}
  .open{font:500 11px -apple-system,system-ui,sans-serif;color:var(--on);text-decoration:none;margin-left:4px}
  .open:hover{text-decoration:underline}
  .desc{color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .err{color:var(--err);font-size:11.5px;white-space:normal}
  .sw{position:relative;width:36px;height:22px;border-radius:11px;background:var(--off);border:0;cursor:pointer;flex:none;transition:background .15s;padding:0}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
  .sw[aria-checked="true"]{background:var(--on)}
  .sw[aria-checked="true"]::after{transform:translateX(14px)}
  .sw:focus-visible{outline:2px solid var(--on);outline-offset:2px}
  .sw:disabled{opacity:.5;cursor:default}
  .empty{padding:18px 14px;color:var(--mute);text-align:center}
  .empty code{font-family:"SF Mono",ui-monospace,monospace;font-size:11.5px}
  footer{padding:0 16px 12px;color:var(--mute);font-size:11px}
</style>
</head>
<body>
  <header><b>matchum</b> recipes <span id="status">…</span></header>
  <ul id="list"></ul>
  <footer>config: ~/.config/matchum/config.js</footer>
  <script src="lib/rpc.js"></script>
  <script src="popup.js"></script>
</body>
</html>
